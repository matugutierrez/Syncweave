services:
  - type: web
    name: syncweave-server
    runtime: node
    plan: free
    buildCommand: npm install && npm run build --workspace packages/crdt && npm run build --workspace server
    startCommand: npm run start --workspace server
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: ./.syncweave-data
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: syncweave-client
    runtime: static
    buildCommand: npm install && npm run build --workspace packages/crdt && npm run build --workspace client
    staticPublishPath: ./client/dist
    envVars:
      - key: VITE_WS_URL
        sync: false
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
